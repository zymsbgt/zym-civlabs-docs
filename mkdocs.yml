site_name: Zym's CivLabs Wiki
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)" # 

      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: blue
      accent: blue
    - media: "(prefers-color-scheme: dark)" # 

      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: blue
      accent: blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
copyright: Copyright &copy; ZymSB
extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/YNRjVvxAXR
      name: My Discord Server


